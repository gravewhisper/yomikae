[project]
name = "yomikae"
version = "0.4.0"
description = "Local server that translates Japanese manga pages to English in place"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "manga-ocr>=0.1.14,<0.2",
  "transformers>=5.20,<5.21",
  "fugashi>=1.3",
  "unidic-lite>=1.0.8",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pillow>=13.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "fonttools>=4.55",
  "pyphen>=0.17",
  "pydensecrf @ git+https://github.com/zyddnys/pydensecrf.git@3ca3d8f0cbd9701f4a765f97fbad43f9b2fe80a6",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]
gpu = [
  "torch>=2.11,<2.12",
  "onnxruntime-gpu>=1.31,<1.32",
  "nvidia-cuda-runtime~=13.0; sys_platform == 'linux'",
  "nvidia-cublas~=13.0; sys_platform == 'linux'",
  "nvidia-cuda-nvrtc~=13.0; sys_platform == 'linux'",
]
cpu = [
  "torch>=2.11,<2.12",
  "onnxruntime>=1.31,<1.32",
]
bench = ["sacrebleu>=2.4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yomikae"]

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "gpu" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the model files in server/models and the manga-ocr weights"]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E9", "F", "I", "B", "UP"]
ignore = ["B019", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["yomikae"]
split-on-trailing-comma = false
