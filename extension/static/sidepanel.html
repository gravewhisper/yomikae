<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yomikae cast sheet</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>Cast sheet</header>
  <div id="work" class="row muted" hidden></div>
  <p id="empty" class="muted">Open a page Yomikae translates to see the names of its work.</p>
  <section id="names" hidden>
    <div class="group" data-kind="name">
      <h2>Characters</h2>
      <div class="list"></div>
    </div>
    <div class="group" data-kind="term">
      <h2>Terms</h2>
      <div class="list"></div>
    </div>
    <form id="add" class="add">
      <h2>Add a name</h2>
      <div class="fields">
        <input id="add-ja" placeholder="Japanese" maxlength="200">
        <input id="add-en" placeholder="English" maxlength="100" required>
        <input id="add-reading" placeholder="Reading (optional)" maxlength="100">
        <select id="add-kind">
          <option value="name">Character</option>
          <option value="term">Term</option>
        </select>
      </div>
      <button type="submit">Add</button>
    </form>
  </section>
  <p id="status" class="muted" hidden></p>
  <script src="sidepanel.js"></script>
</body>
</html>
